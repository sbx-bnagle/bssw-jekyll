<div class="sidebar-col col-xl-3 col-lg-3 col-md-3 col-sm-3 pr-0">
    <div id="sidebar" class="sidebar">
	<div class="sidebar-inner">
	    <h3>Resources by Topic</h3>
	    <div class="accordion panel-group" id="accordionSidebar" role='tablist'>
		{%- for category in site.data.categories %}
		{%- assign index = forloop.index0 %}
		{%- assign cat = category.name | split: " " %}
		<div class="card panel">
		    <div class="card-header" id="heading-{{ index }}" >
			<h2 class="mb-0">
			    <button class="btn btn-link  collapsed" type="button" data-toggle="collapse" data-target="#collapse-{{ index }}" aria-expanded="false" aria-controls="collapse-{{ index }}">
				{{ category.name }}
			    </button>
			</h2>
		    </div>
		    <div id="collapse-{{ index }}" class="collapse " aria-labelledby="heading-{{ index }}" data-parent="#accordionSidebar">
			<div class="card-body">
			    <ul class="caret-list foo">
				<li
				    ><a href="/items?category={{ category.slug }}">All {{ cat[1] }} Resources</a></li>
				{%- for topic in category.topics %}
				    <li
					><a href="/items?topic={{ topic.slug }}">{{ topic.name }}</a></li>
				{%- endfor %}
			    </ul>
			</div>
		    </div>
		</div>
		{%- endfor %}
	    </div>

	</div>




	<ul class="caret-list">
	    <li><a href="/items">View All Resources</a></li>
	</ul>
    </div>
</div>
